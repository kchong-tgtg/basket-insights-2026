name: Encrypt HTML with StatiCrypt

on:
  push:
    branches:
      - main
    paths:
      - '**.html'
  workflow_dispatch:

jobs:
  encrypt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install staticrypt
        run: npm install -g staticrypt@3

      - name: Encrypt HTML files
        env:
          PASS: ${{ secrets.STATICRYPT_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual run: find all HTML files but skip already-encrypted ones
            files=$(find . -type f -name "*.html" -not -path "./.github/*")
          else
            # Push: only encrypt files changed in this commit
            files=$(git diff --name-only HEAD~1 HEAD | grep '\.html$' | grep -v '\.github')
          fi

          echo "$files" | while read file; do
            [ -z "$file" ] && continue
            [ ! -f "$file" ] && continue

            # Skip already-encrypted files
            if grep -q "staticrypt" "$file"; then
              echo "Skipping $file (already encrypted)"
              continue
            fi

            echo "Encrypting $file"
            dir=$(dirname "$file")
            title=$(grep -oP '(?<=<title>)[^<]+' "$file" | head -1)
            staticrypt "$file" -p "$PASS" -d "$dir" --config false --short \
              --template-title "${title:-Protected Page}" \
              --template-color-primary "#00615F" \
              --template-color-secondary "#F9F3F0" \
              --template-button "UNLOCK"
          done

      - name: Commit encrypted files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto-encrypt HTML files [skip ci]"
          git push
